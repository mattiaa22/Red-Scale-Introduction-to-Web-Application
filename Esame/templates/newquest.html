{% extends 'base.html' %}

{% block title %}
Create New Quest
{% endblock %}

{% block active_new_quest %}
active
{% endblock %}

{% block content %}
<div class="col-12 col-md-8 offset-md-2 col-lg-6 offset-lg-3 mb-5">
  
  <h3 class="mb-4 text-primary"><i class="bi bi-journal-plus"></i> Forge a New Quest</h3>
  
  <div class="card shadow-sm border-0 bg-body-tertiary">
    <div class="card-body p-4">
      
      <form action="{{ url_for('new_quest') }}" method="POST" enctype="multipart/form-data">

        <div class="mb-3">
          <label for="title" class="form-label fw-bold">Quest Title</label>
          <input type="text" class="form-control" name="title" id="title" placeholder="e.g. The Dragon's Lair" required />
        </div>

        <div class="row mb-3">
          <div class="col-sm-6 mb-3 mb-sm-0">
            <label for="duration" class="form-label fw-bold">Duration (minutes)</label>
            <input type="number" class="form-control" name="duration" id="duration" placeholder="e.g. 120" min="10" required />
          </div>
          
          <div class="col-sm-6">
            <label for="type" class="form-label fw-bold">Quest Type</label>
            <select class="form-select" name="type" id="type" required>
              <option value="" disabled selected>Select type...</option>
              <option value="combat">Combat</option>
              <option value="exploration">Exploration</option>
              <option value="puzzle">Puzzle</option>
              <option value="stealth">Stealth</option>
              <option value="magic">Magic</option>
              <option value="survival">Survival</option>
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label for="difficulty" class="form-label fw-bold">Difficulty Level</label>
          <select class="form-select" name="difficulty" id="difficulty" required>
            <option value="" disabled selected>Select difficulty...</option>
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
            <option value="legendary">Legendary</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="description" class="form-label fw-bold">Short Description</label>
          <textarea class="form-control" name="description" id="description" placeholder="Describe the adventure..." rows = "4" minlength = "20" maxlength="250" required></textarea>
        </div>

        <div class="mb-4">
          <label for="quest_img" class="form-label fw-bold">Promotional Image</label>
          <input type="file" class="form-control" name="quest_img" id="quest_img" accept="image/*" required />
          <div class="form-text">Upload an illustration for the quest.</div>
        </div>

        <button type="submit" class="btn-cult btn-cult-primary btn-cult-block fw-bold">
          <i class="bi bi-plus-circle"></i> Create Quest
        </button>
      </form>
      
    </div>
  </div>
</div>
{% endblock %}
